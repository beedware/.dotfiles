# Light
set -g pane-border-style fg=colour8
set -g pane-active-border-style fg=colour8

set -g status-style bg="#DFDFDF",fg=colour0
set -g mode-style bg="#dfa0f0",fg=colour0
set -g message-style bg="#dfa0f0",fg=colour0,width=100%,fill="#dfa0f0"
set -g message-command-style bg="#dfa0f0",fg=colour0,width=100%,fill="#dfa0f0"

set -g status-left ""
set -g status-right "#(whoami)@#H :: #S"
set -g status-left-length 100
set -g status-right-length 100

set -g window-status-format "#[bg=#C8C8C8] #I:#W#F "
set -g window-status-current-style none
set -g window-status-current-format "#[fg=colour0,bg=#F0F0F0] #I:#W#F "
set -g window-status-separator ""
