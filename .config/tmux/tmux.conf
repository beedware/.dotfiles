set-option -sa terminal-overrides ",xterm*:Tc"
set-option -g focus-events on
set -g default-terminal "tmux-256color"
set -g terminal-features 'alacritty:RGB,foot:RGB,st:RGB,kitty:RGB,wezterm:RGB,xterm*:RGB'
set -g cursor-style block
set -g allow-passthrough on


bind-key x kill-pane
set -g detach-on-destroy off

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

set -g mouse on

set-option -g history-limit 100000

set -g set-titles on
set -g automatic-rename off
set -g set-titles-string "tmux - #S"

bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind-key -n M-B set -g status

set-option -s escape-time 0

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

bind-key -n S-Up resize-pane -U 5
bind-key -n S-Down resize-pane -D 5
bind-key -n S-Left resize-pane -L 5
bind-key -n S-Right resize-pane -R 5

bind -n M-h previous-window
bind -n M-l next-window

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key "o" display-popup -E -b none -T "tsi" -w 100% -h 40% -x 0 -y 100% -d "#{pane_current_path}" "~/.local/bin/tsi --full-screen --bordered"
bind-key "n" display-popup -E -b none -T "ts" -w 100% -h 3 -x 0 -y 100% -d "#{pane_current_path}" "~/.local/bin/ts --full-screen-bordered"

bind-key -n M-t switch-client -l

# Dark
set -g pane-border-style fg=colour8
set -g pane-active-border-style fg=colour8

set -g status-style bg="#313131",fg=colour15
set -g mode-style bg="#7030AF",fg=colour15
set -g message-style bg="#7030AF",fg=colour15,width=100%,fill="#7030AF"
set -g message-command-style bg="#7030AF",fg=colour15,width=100%,fill="#7030AF"

set -g status-left ""
set -g status-right "#(whoami)@#H :: #S"
set -g status-left-length 100
set -g status-right-length 100

set -g window-status-format "#[fg=colour15,bg=#545454] #I:#W#F "
set -g window-status-current-style none
set -g window-status-current-format "#[fg=colour15,bg=#0F0F0F] #I:#W#F "
set -g window-status-separator ""
