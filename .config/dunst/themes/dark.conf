# theme: dark

[global]
    follow = mouse
    origin = bottom-left
    offset = 0x0

[urgency_low]
    background = "#000000"
    foreground = "#ffffff"
    frame_color = "#79a8ff"

[urgency_normal]
    background = "#000000"
    foreground = "#ffffff"
    frame_color = "#79a8ff"

[urgency_critical]
    background = "#000000"
    foreground = "#ff7f9f"
    frame_color = "#ff7f9f"
